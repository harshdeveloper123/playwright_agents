
name: Playwright Tests

on:
  push:
    branches: [main, master]

  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    # Environment variables required by Playwright tests
    env:
      BASE_URL: ${{ vars.BASE_URL }}
      STANDARD_USERNAME: ${{ secrets.STANDARD_USERNAME }}
      STANDARD_PASSWORD: ${{ secrets.STANDARD_PASSWORD }}
      LOCKED_USERNAME: ${{ secrets.LOCKED_USERNAME }}
      LOCKED_PASSWORD: ${{ secrets.LOCKED_PASSWORD }}

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Install Playwright browsers and system dependencies
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # 5. Run Playwright tests
      - name: Run Playwright tests
        run: npx playwright test

      # 6. Upload reports, traces and screenshots
      - name: Upload Playwright reports and test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 30
          if-no-files-found: ignore
